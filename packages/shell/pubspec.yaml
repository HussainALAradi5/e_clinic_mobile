name: e_clinic_shell
description: The e-Clinic app shell shared by the apps — start-up, sign-in, two-factor, password reset, app lock, account security and appearance.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  e_clinic_core:
    path: ../core
  e_clinic_data:
    path: ../data
  e_clinic_ui:
    path: ../ui
  flutter_riverpod: ^3.0.0
  go_router: ">=14.0.0 <18.0.0"
  local_auth: ^2.3.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^22.3.3
