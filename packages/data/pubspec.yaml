    sdk: flutter
  e_clinic_core:
    path: ../core
  flutter_riverpod: ^3.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
