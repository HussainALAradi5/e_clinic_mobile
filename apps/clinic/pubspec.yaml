name: e_clinic_app
description: e-Clinic — one app for patients (visits, results, invoices) and staff (schedule, scan, sessions, approvals).
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  e_clinic_core:
    path: ../../packages/core
  e_clinic_data:
    path: ../../packages/data
  e_clinic_shell:
    path: ../../packages/shell
  e_clinic_ui:
    path: ../../packages/ui
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ">=9.2.0 <11.0.0"
  go_router: ">=14.0.0 <18.0.0"
  geolocator: ^14.0.0
  image_picker: ^1.1.0
  mobile_scanner: ^7.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
