name: e_clinic_patient
description: e-Clinic patient app — visits, booking, results, prescriptions and invoices.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  e_clinic_core:
    path: ../../packages/core
  e_clinic_data:
    path: ../../packages/data
  e_clinic_features:
    path: ../../packages/features
  e_clinic_ui:
    path: ../../packages/ui
  flutter_riverpod: ^3.0.0
  go_router: ">=14.0.0 <18.0.0"
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
